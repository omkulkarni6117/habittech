name: Build HabitTech APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: habittech
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate the Android project
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.habittech --project-name habittech --description "HabitTech" .
            rm -f test/widget_test.dart
          fi
          sed -i 's/android:label="[^"]*"/android:label="HabitTech"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Test
        run: flutter test
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/HabitTech.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HabitTech-apk
          path: habittech/dist/HabitTech.apk
